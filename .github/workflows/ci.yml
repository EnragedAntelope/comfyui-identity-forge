name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Validate data, tests & generated docs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the floor (requires-python = ">=3.10") and a current release.
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out code
        # Pinned to the same commit SHA (v7.0.1) the publish workflow uses.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python ${{ matrix.python-version }}
        # Pinned to an immutable commit SHA (v7.0.0), matching the publish
        # workflow's SHA-pinning convention. Re-verify and bump when updating:
        #   git ls-remote https://github.com/actions/setup-python refs/tags/v7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate data integrity
        # The pack has no third-party deps and the engine runs without ComfyUI, so
        # nothing needs installing — the standard library is enough.
        run: python tests/validate_data.py
      - name: Run the test suite
        # -t . makes `tests` a genuine subpackage of the repo root, which is
        # what guarantees tests/__init__.py (the comfy_api stub registration)
        # runs before any test_*.py file imports a node module. Without it,
        # `discover` imports test files as bare top-level modules and the
        # package __init__ never runs first.
        run: python -m unittest discover -s tests -t . -v
      - name: Check generated reference docs are current
        run: python scripts/generate_reference_docs.py --check
      - name: Check generated frontend data is current
        run: python scripts/generate_js_data.py --check
      - name: Check generated frontend fixtures are current
        run: python scripts/dump_frontend_fixtures.py --check
      - name: Check every roster entry carries a release stamp
        # data/versions.py is what lets the sample galleries offer "Newest first"
        # and a "New in <version>" filter. An entry with no stamp would silently
        # sort as though it had always shipped, which is the half a convention
        # cannot enforce on its own. Stdlib-only and network-free.
        run: python scripts/stamp_versions.py --check
      - name: Check every roster entry's gallery image is current
        # Network-free and stdlib-only by design: it compares
        # gallery/render_manifest.json against the data layer and never touches
        # ComfyUI, so it fits this dependency-free job unchanged.
        run: python scripts/render_gallery.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # A SEPARATE job on purpose. The test job above must stay dependency-free,
    # because that is the property being asserted: the pack and its tests import
    # nothing but the standard library. ruff is developer tooling, so installing
    # it there would quietly weaken that guarantee.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pinned so a new ruff release cannot turn a green branch red on its own.
        run: pip install "ruff==0.15.11"
      - name: Lint
        run: python -m ruff check .

  frontend:
    name: Frontend smoke tests
    runs-on: ubuntu-latest
    # A SEPARATE job for the same reason `lint` is: the `test` job's
    # dependency-free property (stdlib only) is itself being asserted, and
    # this job's own devDependency (jsdom) must never leak into it.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        # Pinned to an immutable commit SHA (v6.5.0). Re-verify and bump when
        # updating: git ls-remote https://github.com/actions/setup-node refs/tags/v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          # registerHooks (tests/frontend/hooks.mjs) needs >=22.15.0 / >=23.5.0.
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend
