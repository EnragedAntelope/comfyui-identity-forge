[project]
name = "comfyui-identity-forge"
version = "0.75.0"
description = "A character creator and person generator for ComfyUI that DESCRIBES characters instead of just naming them: 1,391 fictional characters each ship a hand-written, canon-checked visual description - garments, colours, masks, markings, signature props - so the look renders on any checkpoint, even ones that have never heard of the character. Plus a wildcard-style person randomizer with a constraint engine, themed archetype presets, a creature/monster/alien form layer with slot-by-slot hybridization, per-element style modifiers, a studio/solid backdrop mode, a save/load character vault, and dual prose/JSON output."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["comfyui", "character", "character creator", "character generator", "character description", "costume", "canon", "person", "person generator", "portrait", "face", "prompt", "prompt generator", "randomizer", "random", "wildcard", "constraint", "cosplay", "archetype", "creature", "monster", "alien", "anthro", "diversity", "ethnicity", "OC"]
dependencies = []

[[project.authors]]
name = "EnragedAntelope"

[project.urls]
Repository = "https://github.com/EnragedAntelope/comfyui-identity-forge"
"Bug Tracker" = "https://github.com/EnragedAntelope/comfyui-identity-forge/issues"

[tool.comfy]
PublisherId = "enragedantelope"
DisplayName = "Identity Forge"
requires-comfyui = ">=0.25.0"

[tool.ruff.lint.per-file-ignores]
# The test and preview scripts prepend the repo root onto sys.path so they can be
# run standalone (``python tests/...``); those imports necessarily follow the shim,
# which is the sole, intentional source of E402 in these files.
"tests/*.py" = ["E402"]
